name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Least-privilege default token (the gate only checks out + builds/tests).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # 35, not 20. The private mirror's validate job reached 17.9 min on
    # 2026-08-08 and then began exceeding 20 outright — GitHub reports that as
    # "Error: The operation was canceled." partway through the e2e run, which
    # reads like a flake or an infra failure rather than the budget being spent.
    # It had been cancelling intermittently for days for the same reason.
    #
    # The downstream mirror runs a larger suite than this one, so it takes
    # longer and hits the cap first. Both files are kept IDENTICAL so
    # cherry-picks between the two never conflict on this.
    #
    # The real cost is the Playwright suite: ~280 tests at `workers: 1`
    # (playwright.config.ts), which is deliberate — the preview server and the
    # demo MAVLink bridge are on fixed --strictPort ports and share one vehicle
    # session, so parallel workers would collide and interfere with each other's
    # parameter writes. Sharding across JOBS (each with its own port pair) is the
    # durable fix if this creeps up again; raising the ceiling is the honest
    # short-term answer while the number is still a real signal.
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Unit tests (web)
        run: npm run test:unit --workspace @arduconfig/web

      - name: E2E
        run: npm run test:e2e

      # The production rolldown build resolves workspace deps differently
      # from the dev server / esbuild used by typecheck+test+e2e above, so a
      # broken production build (e.g. a workspace package missing from the
      # Vite source-alias map, #163) used to pass this gate and only fail
      # afterwards in Web Deploy. Run the exact Pages build command here so
      # it is a required merge check.
      - name: Production build (web)
        run: npm run build --workspace @arduconfig/web
        env:
          ARDUCONFIG_WEB_BASE: /ArduConfigurator/

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
            tests/e2e/__screenshots__
          retention-days: 7
          if-no-files-found: ignore
